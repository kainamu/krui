<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中央クリスタル AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true">
    <a-marker preset="hiro">
      <a-entity position="0 0 0" scale="0.24 0.24 0.24">
        <!-- 課題1の中央クリスタル -->
        <a-octahedron position="0 2.5 0" radius="1"
          material="color: #66ddff; opacity: 0.75; transparent: true; metalness: 0.3; roughness: 0.1"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
          animation__float="property: position; from: 0 2.2 0; to: 0 3 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
        </a-octahedron>
        <!-- 台座 -->
        <a-cylinder position="0 0.3 0" radius="1.5" height="0.6" color="#444455"></a-cylinder>
        <a-cylinder position="0 0.65 0" radius="1.1" height="0.3" color="#555566"></a-cylinder>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
